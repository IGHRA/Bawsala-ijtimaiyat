    <script>
        let currentSessionId = null;
        let tempTechCard = null;

        let appData = JSON.parse(localStorage.getItem('bawsala_history_data')) || {
            settings: { academy: 'جهة درعة تافيلالت', directorate: 'مديرية زاكورة', school: 'ثانوية أفلاندرا التأهيلية', teacher: 'مولاي احفيظ الزاهي' },
            sections: ['1/1', '1/2', '1/3', '1/4', '3/3', '3/4'],
            sessions: [
                { id: 1, section: '1/1', subject: 'التاريخ', title: 'حصة المعالجة 1: قراءة النصوص التاريخية 📜', status: 0, date: '', techCard: null },
                { id: 2, section: '1/1', subject: 'الجغرافيا', title: 'حصة المعالجة 2: استقراء الخرائط الجغرافية 🗺️', status: 0, date: '', techCard: null }
            ]
        };

        function saveData() { 
            localStorage.setItem('bawsala_history_data', JSON.stringify(appData)); 
        }

        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
        }

        function saveSettings() {
            appData.settings = {
                academy: document.getElementById('academyInput').value,
                directorate: document.getElementById('directorateInput').value,
                school: document.getElementById('schoolInput').value,
                teacher: document.getElementById('teacherInput').value
            };
            saveData();
            alert('تم حفظ البيانات بنجاح!');
        }

        function addSection() {
            const name = document.getElementById('newSectionName').value;
            if(name && !appData.sections.includes(name)) {
                appData.sections.push(name);
                saveData();
                renderSections();
                document.getElementById('newSectionName').value = '';
            }
        }

        function renderSections() {
            const select = document.getElementById('sectionSelect');
            if(!select) return;
            select.innerHTML = '<option value="">-- اختر القسم --</option>';
            appData.sections.forEach(sec => {
                select.innerHTML += `<option value="${sec}">${sec}</option>`;
            });
        }

        function loadSessions() {
            const selectedSec = document.getElementById('sectionSelect').value;
            const selectedSub = document.getElementById('subjectSelect').value;
            const container = document.getElementById('sessionsContainer');
            if(!container) return;
            container.innerHTML = '';

            let filtered = appData.sessions.filter(s => s.section === selectedSec);
            if(selectedSub !== 'جميع المكونات') {
                filtered = filtered.filter(s => s.subject === selectedSub);
            }

            if(filtered.length === 0) {
                container.innerHTML = '<p style="color:#64748b;">لا توجد حصص مسجلة لهذا الاختيار.</p>';
                return;
            }

            filtered.forEach(s => {
                let statusClass = s.status === 0 ? 'status-not-started' : (s.status === 1 ? 'status-in-progress' : 'status-completed');
                let statusText = s.status === 0 ? 'غير منجزة' : (s.status === 1 ? 'قيد الإنجاز' : 'منجزة');
                let hasCardBadge = s.techCard ? '<span style="color:#006466; font-size:0.85rem;"><i class="fa-solid fa-paperclip"></i> بطاقة مرفقة</span>' : '';

                container.innerHTML += `
                    <div class="session-card">
                        <div>
                            <span style="font-size:0.8rem; background:#006466; color:white; padding:2px 8px; border-radius:4px; margin-left:8px;">${s.subject}</span>
                            <span class="text-link" onclick="openTextModal(${s.id})">${s.title}</span>
                            ${hasCardBadge}
                            <div style="font-size:0.8rem; color:#64748b; margin-top:4px;">تاريخ الإنجاز: ${s.date || '---'}</div>
                        </div>
                        <button class="status-btn ${statusClass}" onclick="toggleStatus(${s.id})">${statusText}</button>
                    </div>
                `;
            });
        }

        function toggleStatus(id) {
            const session = appData.sessions.find(s => s.id === id);
            if(session) {
                session.status = (session.status + 1) % 3;
                session.date = new Date().toLocaleDateString('ar-MA');
                saveData();
                loadSessions();
            }
        }

        function openTextModal(sessionId) {
            currentSessionId = sessionId;
            const session = appData.sessions.find(s => s.id === sessionId);
            tempTechCard = session.techCard ? JSON.parse(JSON.stringify(session.techCard)) : null;
            
            document.getElementById('modalTitle').innerText = session.title;
            const text = "تعتبر الممارسة المعرفية في مادة الاجتماعيات مدخلاً أساسياً لفهم المجال الجغرافي والزمني، حيث يعتمد التحليل التاريخي والجغرافي على استقراء النصوص والوثائق الرسمية لاستخلاص المفاهيم والعوامل.";
            document.getElementById('textContainer').innerHTML = text.split(' ').map(word => `<span class="word-span" onclick="highlightWord(this)" ondblclick="markError(this)">${word}</span>`).join(' ');

            document.getElementById('driveInputBox').style.display = 'none';
            document.getElementById('driveUrlInput').value = '';

            updateTechCardUI();
            document.getElementById('textModal').style.display = 'flex';
        }

        function updateTechCardUI() {
            const fileStatus = document.getElementById('techFileStatus');
            const viewBtn = document.getElementById('viewCardBtn');

            if (tempTechCard) {
                fileStatus.innerText = `البطاقة التقنية المرفقة: ${tempTechCard.name}`;
                fileStatus.style.color = "#006466";
                viewBtn.style.display = "inline-flex";
            } else {
                fileStatus.innerText = "لم يتم إرفاق أي بطاقة تقنية لهذه الحصة بعد.";
                fileStatus.style.color = "#64748b";
                viewBtn.style.display = "none";
            }
        }

        function handleLocalFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                tempTechCard = { type: 'local', name: file.name, data: e.target.result };
                updateTechCardUI();
            };
            reader.readAsDataURL(file);
        }

        function toggleDriveInput() {
            const box = document.getElementById('driveInputBox');
            box.style.display = (box.style.display === 'flex') ? 'none' : 'flex';
        }

        function saveDriveLink() {
            const url = document.getElementById('driveUrlInput').value.trim();
            if(!url) return alert('يرجى إدخال رابط صحيح من Google Drive');
            let embedUrl = url.includes('/view') ? url.replace('/view', '/preview') : url;
            tempTechCard = { type: 'drive', name: 'ملف Google Drive', data: embedUrl };
            document.getElementById('driveInputBox').style.display = 'none';
            updateTechCardUI();
        }

        function openCardBuilder() {
            document.getElementById('cardBuilderModal').style.display = 'flex';
        }

        function closeCardBuilder() {
            document.getElementById('cardBuilderModal').style.display = 'none';
        }

        function generateAndSaveCard() {
            const cardData = {
                subject: document.getElementById('cardSubject').value,
                level: document.getElementById('cardLevel').value,
                duration: document.getElementById('cardDuration').value,
                task: document.getElementById('cardTask').value,
                steps: document.getElementById('cardSteps').value.split('\n'),
                s1Desc: document.getElementById('step1Desc').value,
                s1Res: document.getElementById('step1Resources').value,
                s2Desc: document.getElementById('step2Desc').value,
                s2Res: document.getElementById('step2Resources').value,
                s3Desc: document.getElementById('step3Desc').value,
                s3Res: document.getElementById('step3Resources').value,
                s4Desc: document.getElementById('step4Desc').value,
                s4Res: document.getElementById('step4Resources').value,
                s5Desc: document.getElementById('step5Desc').value,
                s5Res: document.getElementById('step5Resources').value,
            };

            tempTechCard = {
                type: 'generated',
                name: 'بطاقة تقنية مخصصة (Generated)',
                content: cardData
            };

            closeCardBuilder();
            updateTechCardUI();
            alert('تم إنشاء البطاقة التقنية بنجاح!');
        }

        function openTechCard() {
            if (!tempTechCard) return;

            if (tempTechCard.type === 'generated') {
                renderPrintableCard(tempTechCard.content);
                document.getElementById('cardPreviewModal').style.display = 'flex';
            } else if(tempTechCard.type === 'drive') {
                window.open(tempTechCard.data, '_blank');
            } else {
                const win = window.open();
                win.document.write(`<iframe src="${tempTechCard.data}" frameborder="0" style="width:100%; height:100vh;" allowfullscreen></iframe>`);
            }
        }

        function renderPrintableCard(data) {
            const s = appData.settings;
            const html = `
                <div class="printable-card">
                    <div style="display:flex; justify-content:space-between; align-items:center; font-weight:bold; text-align:center;">
                        <div>${s.academy || 'الأكاديمية الجهوية'}<br>${s.directorate || 'المديرية الإقليمية'}</div>
                        <div><img src="https://upload.wikimedia.org/wikipedia/commons/2/2c/Coat_of_arms_of_Morocco.svg" width="50"><br>المملكة المغربية</div>
                        <div>المؤسسة: ${s.school || 'اسم المؤسسة'}<br>الأستاذ: ${s.teacher || 'اسم الأستاذ'}</div>
                    </div>

                    <div class="card-header-yellow">بطاقة تقنية لحصة المعالجة المكثفة</div>

                    <div class="card-header-blue" style="display:flex; justify-content:space-between;">
                        <span>المكون: ${data.subject}</span>
                        <span>المستوى الدراسي: ${data.level}</span>
                    </div>

                    <div style="padding: 8px; border: 1px solid #000; margin-top:5px; background:#fef9c3;">
                        <b>مدة الإنجاز:</b> ${data.duration}<br>
                        <b>المهمة:</b> ${data.task}
                    </div>

                    <div style="margin-top: 8px; font-weight:bold;">خطوات إنجاز المهمة:</div>
                    <ol style="margin-right:20px;">
                        ${data.steps.map(st => `<li>${st}</li>`).join('')}
                    </ol>

                    <div class="card-header-yellow" style="font-size:15px; padding:4px;">هيكلة الحصة</div>

                    <table>
                        <thead>
                            <tr>
                                <th>مراحل الحصة</th>
                                <th>توصيف مختصر</th>
                                <th>الوقت المخصص</th>
                                <th>الموارد والدعامات</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td><b>افتتاح الحصة</b></td>
                                <td>${data.s1Desc}</td>
                                <td>15 دقيقة</td>
                                <td>${data.s1Res}</td>
                            </tr>
                            <tr>
                                <td><b>النمذجة</b></td>
                                <td>${data.s2Desc}</td>
                                <td>10 دقائق</td>
                                <td>${data.s2Res}</td>
                            </tr>
                            <tr>
                                <td><b>الممارسة الثنائية</b></td>
                                <td>${data.s3Desc}</td>
                                <td>15 دقيقة</td>
                                <td>${data.s3Res}</td>
                            </tr>
                            <tr>
                                <td><b>الممارسة المستقلة</b></td>
                                <td>${data.s4Desc}</td>
                                <td>10 دقائق</td>
                                <td>${data.s4Res}</td>
                            </tr>
                            <tr>
                                <td><b>اختتام الحصة</b></td>
                                <td>${data.s5Desc}</td>
                                <td>5 دقائق</td>
                                <td>${data.s5Res}</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            `;
            document.getElementById('printableArea').innerHTML = html;
        }

        function printCard() {
            const printContent = document.getElementById('printableArea').innerHTML;
            const win = window.open('', '', 'width=900,height=650');
            win.document.write(`<html><head><title>طباعة البطاقة التقنية</title><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet"><style>body{font-family:'Tajawal',sans-serif;}</style></head><body>${printContent}</body></html>`);
            win.document.close();
            win.focus();
            win.print();
        }

        function saveModalChanges() {
            if (currentSessionId !== null && currentSessionId !== undefined) {
                const sessionIndex = appData.sessions.findIndex(s => s.id === currentSessionId);
                if (sessionIndex !== -1) {
                    appData.sessions[sessionIndex].techCard = tempTechCard;
                    saveData();
                    loadSessions();
                    closeModal();
                    alert('تم حفظ التغييرات بنجاح! 💾');
                }
            }
        }

        function closeModal() {
            tempTechCard = null;
            document.getElementById('textModal').style.display = 'none';
        }

        function highlightWord(element) { element.classList.toggle('highlight'); }
        function markError(element) { element.classList.toggle('error'); }
        function toggleSingleAnswer(id) {
            const box = document.getElementById(id);
            box.style.display = (box.style.display === 'block') ? 'none' : 'block';
        }
        function toggleAnswers() {
            document.querySelectorAll('.answer-box').forEach(box => {
                box.style.display = (box.style.display === 'block') ? 'none' : 'block';
            });
        }

        let currentFontSize = 18;
        function changeFontSize(delta) {
            currentFontSize += delta;
            document.getElementById('textContainer').style.fontSize = currentFontSize + 'px';
        }

        let timer;
        function startTimer() {
            let seconds = 120;
            clearInterval(timer);
            timer = setInterval(() => {
                seconds--;
                let m = Math.floor(seconds / 60);
                let s = seconds % 60;
                document.getElementById('timerDisplay').innerText = `0${m}:${s < 10 ? '0' : ''}${s}`;
                if(seconds <= 0) {
                    clearInterval(timer);
                    alert('انتهى وقت الحصة!');
                }
            }, 1000);
        }

        function exportData() {
            const blob = new Blob([JSON.stringify(appData)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'bawsala_social_studies.json';
            a.click();
        }

        function importData(e) {
            const file = e.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                appData = JSON.parse(event.target.result);
                saveData();
                alert('تم استرجاع البيانات بنجاح!');
                location.reload();
            };
            reader.readAsText(file);
        }

        function filterTerms() {
            let input = document.getElementById('termSearch').value.toLowerCase();
            document.querySelectorAll('.term-card').forEach(item => {
                item.style.display = item.innerText.toLowerCase().includes(input) ? 'block' : 'none';
            });
        }

        function toggleDarkMode() { document.body.classList.toggle('dark-mode'); }

        window.onload = function() {
            renderSections();
            if(appData.settings && appData.settings.teacher) {
                if(document.getElementById('teacherInput')) document.getElementById('teacherInput').value = appData.settings.teacher;
                if(document.getElementById('schoolInput')) document.getElementById('schoolInput').value = appData.settings.school;
                if(document.getElementById('academyInput')) document.getElementById('academyInput').value = appData.settings.academy;
                if(document.getElementById('directorateInput')) document.getElementById('directorateInput').value = appData.settings.directorate;
            }
        };
    </script>
